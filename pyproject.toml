[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gleipnir"
version = "0.1.0"
description = "Learning lab of proof-of-concept demos for market calibration and control, built on mjollnir"
readme = "README.md"
requires-python = ">=3.11"  # floor set by mjollnir (jax 0.9 / flax)
license = {file = "LICENSE"}
authors = [
    {name = "Yunian Pan", email = "yp1170@nyu.edu"}
]
keywords = [
    "deep-hedging", "reinforcement-learning", "counterfactual-simulation",
    "calibration", "options", "quantitative-finance", "jax",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# mjollnir supplies the market simulation, calibration and pricing substrate.
# The direct dependencies below are the ones gleipnir code imports itself.
dependencies = [
    "mjollnir",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "jax>=0.9.0,<0.10",
    "flax>=0.8.0",
    "optax>=0.2.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
# FastAPI backend serving the demos.
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.3",
    "yfinance>=0.2.28",
]
# Torch agents and training loops (deep hedging, POMARL).
rl = [
    "torch>=2.1.0",
]
# JAX device backends (install at most one to match your hardware).
cuda = ["jax[cuda13]>=0.9.0,<0.10 ; sys_platform == 'linux'"]
metal = ["jax-metal>=0.1.0 ; sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx2>=1.0",  # FastAPI/Starlette TestClient transport
    "ruff>=0.6.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "seaborn>=0.13",  # the notebooks' plots
    "plotly>=5.18",  # 02's interactive implied-vol surface
]

[project.urls]
Homepage = "https://app.yunianpan.com"
Repository = "https://github.com/UnionPan/gleipnir"

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "metal" }]]

[tool.uv.sources]
# Pinned to a release tag; uv.lock records the resolved commit. The core is
# enough here: gleipnir brings its own yfinance (web) for the fetcher it uses.
# Co-develop against a local checkout with `uv run --with-editable ../mjollnir ...`
# (what `make dev` does).
mjollnir = { git = "https://github.com/UnionPan/mjollnir", tag = "v0.5.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "backend", "scripts", "tests"]

[tool.ruff.lint]
# Explicit selection (mirrors mjollnir) so CI does not drift with ruff's defaults.
select = ["E", "F", "W", "B", "UP", "RUF", "BLE"]
ignore = [
    "E501",   # long lines: formulas and log lines read better unwrapped
    "E741",   # ambiguous single-letter names: standard math notation
    "RUF001", "RUF002", "RUF003",  # Greek letters and math glyphs in strings/docstrings
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # re-export surfaces

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import the API app, `backend/` at the repo root, which is not an installed package.
pythonpath = ["."]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "slow: long-running tests",
    "network: needs live market data over the internet (deselected by default; run with -m network)",
]
addopts = "-m 'not network'"
