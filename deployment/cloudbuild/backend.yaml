# Cloud Build configuration for backend deployment
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/options-desk-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/options-desk-backend:latest'
      - '-f'
      - 'deployment/docker/backend/Dockerfile'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/options-desk-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/options-desk-backend:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'options-desk-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/options-desk-backend:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--port'
      - '8080'
      - '--env-vars-file=deployment/env/backend.env'
      # The API compiles its programs before the port opens (WARM_UP=startup).
      # Cloud Run gives an instance full CPU only while it starts or serves, so the
      # compile belongs in startup, with extra CPU there.
      - '--cpu-boost'
      # One instance stays compiled, so visitors never wait through that startup;
      # a new revision takes traffic only once its own compile is done.
      - '--min-instances'
      - '1'
      # Compute guard, platform side: an instance takes at most 20 requests at
      # once (heavy ones also queue for its 2 job slots), and abuse cannot scale
      # past 3 instances of cost.
      - '--concurrency'
      - '20'
      - '--max-instances'
      - '3'

images:
  - 'gcr.io/$PROJECT_ID/options-desk-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/options-desk-backend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
