name: Backend CI

on:
  push:
    branches: [main, feature/*, phase0/*]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.27'
          enable-cache: true

      - name: Install the locked environment
        # mjollnir resolves to the commit pinned in uv.lock.
        run: uv sync --frozen --extra web --extra rl

      - name: Lint
        run: uv run ruff check backend src scripts tests

      - name: Test
        # Network tests (live market data) are deselected by default.
        env:
          JAX_PLATFORMS: cpu
        run: uv run pytest -q -W error::DeprecationWarning
